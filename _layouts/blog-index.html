<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | Ailana Design Studio</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="/uploads/Logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  window.dataLayer = window.dataLayer || [];

  gtag('js', new Date());

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: oklch(0.98 0.004 85); color: #3B4A30; font-family: 'IBM Plex Sans', sans-serif; }
  a { color: inherit; }

  .section-pad { padding-left: 48px; padding-right: 48px; }
  @media (max-width: 640px) {
    .section-pad { padding-left: 20px !important; padding-right: 20px !important; }
    .logo-link .logo-text { display: none; }
  }

  nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 48px;
    background: oklch(0.98 0.004 85 / 0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid oklch(0.85 0.006 90);
  }
  .logo-link {
    font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 19px;
    letter-spacing: -0.01em; text-decoration: none;
    display: flex; align-items: center; gap: 9px;
  }
  .nav-contact-btn {
    font-size: 14px; padding: 9px 18px; border: 1px solid #3B4A30; border-radius: 100px;
    text-decoration: none; white-space: nowrap;
  }

  main { max-width: 820px; margin: 0 auto; padding: 80px 48px 120px; }
  h1 { font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 42px; letter-spacing: -0.02em; margin: 0 0 12px; }
  .lead { font-size: 16.5px; color: oklch(0.46 0.01 90); max-width: 560px; margin: 0 0 56px; }

  .post-list { display: flex; flex-direction: column; gap: 4px; }
  .post-row {
    display: block; padding: 28px 0; border-top: 1px solid oklch(0.85 0.006 90);
    text-decoration: none; color: inherit;
  }
  .post-list .post-row:last-child { border-bottom: 1px solid oklch(0.85 0.006 90); }
  .post-row .meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: oklch(0.5 0.01 90); margin-bottom: 8px; }
  .post-row .lang-tag { border: 1px solid oklch(0.8 0.008 90); border-radius: 100px; padding: 2px 9px; text-transform: uppercase; letter-spacing: 0.03em; }
  .post-row h2 { font-family: 'Tektur', sans-serif; font-weight: 600; font-size: 21px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .post-row p { font-size: 14.5px; line-height: 1.55; color: oklch(0.4 0.008 90); margin: 0; max-width: 620px; }
  .post-row:hover h2 { color: #3F6B2A; }

  footer {
    padding: 32px 48px; border-top: 1px solid oklch(0.85 0.006 90);
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font-size: 13px; color: oklch(0.46 0.01 90); max-width: 1240px; margin: 0 auto;
  }
</style>
</head>
<body>

<!-- Yandex.Metrika counter -->
<script type="text/javascript">
    (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=110515935', 'ym');

    ym(110515935, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
</script>
<noscript><div><img src="https://mc.yandex.ru/watch/110515935" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
<!-- /Yandex.Metrika counter -->

<nav class="section-pad">
  <a href="/index.html" class="logo-link">
    <img src="/uploads/Logo.svg" alt="Ailana logo" width="22" height="22">
    <span class="logo-text">Ailana Design Studio</span>
  </a>
  <a href="https://wa.me/996557475741" target="_blank" rel="noopener noreferrer" class="nav-contact-btn">Связаться</a>
</nav>

<main>
  <h1>Блог</h1>
  <p class="lead">{{ page.description }}</p>

  <div class="post-list">
    {% for post in site.posts %}
    <a class="post-row" href="{{ post.url }}">
      <div class="meta">
        <span class="lang-tag">{{ post.lang }}</span>
        <span>{{ post.date | date: "%-d %B %Y" }}</span>
      </div>
      <h2>{{ post.title }}</h2>
      <p>{{ post.description }}</p>
    </a>
    {% endfor %}
  </div>
</main>

<footer class="section-pad">
  <span>© {{ 'now' | date: "%Y" }} Ailana Design Studio</span>
  <span>Удалённо · Бишкек</span>
</footer>

</body>
</html>
